services:
  postgres:
    image: postgres:16-alpine
    container_name: jangokeeper-postgres
    environment:
      POSTGRES_DB: jangokeeper
      POSTGRES_USER: jangokeeper
      POSTGRES_PASSWORD: jangokeeper
    ports:
      - "5432:5432"
    volumes:
      - jangokeeper-pgdata:/var/lib/postgresql/data

volumes:
  jangokeeper-pgdata:
